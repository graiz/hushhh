name: Hushhh
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.1

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64

targets:
  Hushhh:
    type: application
    platform: macOS
    sources:
      - path: Hushhh
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - sdk: CoreML.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Accelerate.framework
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: Build QVAC engine
        script: |
          # Homebrew lives in /opt/homebrew (Apple silicon) or /usr/local (Intel).
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          "$SRCROOT/scripts/build-qvac.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Hushhh
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Hushhh/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hushhh/Hushhh.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Hushhh/Engines/QVAC/Hushhh-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/build-qvac/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/build-qvac
        OTHER_LDFLAGS: -lparakeet_bundle -lc++
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
